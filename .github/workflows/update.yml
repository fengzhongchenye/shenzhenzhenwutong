name: Update Notices Daily

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.52.0-jammy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Run scraper
        run: python fetch_notices.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add notices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update notices" && git push)
