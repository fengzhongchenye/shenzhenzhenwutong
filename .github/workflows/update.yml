name: Update Notices Daily

on:
  schedule:
    # 北京时间每天9点 = UTC 1:00
    - cron: "0 1 * * *"
  workflow_dispatch:   # 允许手动触发

# 👇 添加这一行，给工作流写入仓库的权限
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4    # 这个版本目前还是 v4，可以继续用

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python fetch_notices.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add notices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update notices" && git push)
